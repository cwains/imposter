<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imposter Party</title>

<style>
* {
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    margin: 0;
    background: linear-gradient(135deg, #1e1e2f, #111);
    color: white;
    text-align: center;
    padding: 20px;
}

h1 {
    font-weight: 600;
}

.card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    padding: 20px;
    border-radius: 20px;
    max-width: 420px;
    margin: 20px auto;
    box-shadow: 0 0 25px rgba(0,0,0,0.4);
}

input {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 10px;
    border: none;
    background: rgba(255,255,255,0.1);
    color: white;
    text-align: center;
}

button {
    padding: 12px 18px;
    margin: 6px 4px;
    border-radius: 12px;
    border: none;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s ease;
}

.primary {
    background: #5865f2;
    color: white;
}

.secondary {
    background: #2ecc71;
    color: white;
}

.danger {
    background: crimson;
    color: white;
}

button:hover {
    transform: scale(1.05);
}

.playerBtn {
    width: 100%;
    background: rgba(255,255,255,0.08);
}

.playerBtn:hover {
    background: rgba(255,255,255,0.15);
}

.playerBtn:disabled {
    background: rgba(255,255,255,0.03);
    opacity: 0.5;
}

#rolePopup {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    justify-content: center;
    align-items: center;
}

.popupContent {
    background: #181828;
    padding: 40px;
    border-radius: 25px;
    width: 80%;
    max-width: 350px;
    animation: fadeIn 0.25s ease;
}

@keyframes fadeIn {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.closeBtn {
    background: crimson;
    margin-top: 20px;
}
</style>
</head>

<body>

<h1>Imposter Party</h1>

<div class="card">
    <div id="playerInputs"></div>

    <button class="secondary" onclick="addPlayer()">Add Player</button>
    <button class="danger" onclick="removePlayer()">Remove Player</button>
    <br>
    <button class="primary" onclick="startGame()">Start Game</button>
    <button onclick="resetGame()">Reset</button>
</div>

<div class="card" id="playerButtons"></div>

<div id="rolePopup">
    <div class="popupContent">
        <h2 id="roleText"></h2>
        <button class="closeBtn" onclick="closeRole()">Close</button>
    </div>
</div>

<script>
const words = [
    "Pizza","Beach","Tiger","School",
    "Airplane","Zombie","Castle",
    "iPhone","Basketball","Prison"
];

let roles = [];
let revealed = [];
let currentPlayer = null;
let names = [];
let playerCount = 0;

function addPlayer() {
    playerCount++;
    const input = document.createElement("input");
    input.placeholder = "Player " + playerCount;
    document.getElementById("playerInputs").appendChild(input);
}

function removePlayer() {
    const container = document.getElementById("playerInputs");
    if (container.lastChild) {
        container.removeChild(container.lastChild);
        playerCount--;
    }
}

function startGame() {
    const inputs = document.querySelectorAll("#playerInputs input");
    names = [];
    roles = [];
    revealed = [];

    inputs.forEach(input => {
        if (input.value.trim() !== "") {
            names.push(input.value.trim());
        }
    });

    if (names.length < 2) {
        alert("need at least 2 players");
        return;
    }

    const randomWord = words[Math.floor(Math.random() * words.length)];
    const imposterIndex = Math.floor(Math.random() * names.length);

    names.forEach((name, i) => {
        if (i === imposterIndex) {
            roles.push("😈 you are the IMPOSTER");
        } else {
            roles.push("🟢 word: " + randomWord);
        }
        revealed.push(false);
    });

    const container = document.getElementById("playerButtons");
    container.innerHTML = "";

    names.forEach((name, i) => {
        const btn = document.createElement("button");
        btn.textContent = name;
        btn.className = "playerBtn";
        btn.onclick = () => revealRole(i);
        container.appendChild(btn);
    });
}

function revealRole(index) {
    if (revealed[index]) return;
    currentPlayer = index;
    document.getElementById("roleText").textContent = roles[index];
    document.getElementById("rolePopup").style.display = "flex";
}

function closeRole() {
    if (currentPlayer !== null) {
        revealed[currentPlayer] = true;
        document.querySelectorAll(".playerBtn")[currentPlayer].disabled = true;
    }
    document.getElementById("rolePopup").style.display = "none";
}

function resetGame() {
    roles = [];
    revealed = [];
    currentPlayer = null;
    names = [];
    document.getElementById("playerButtons").innerHTML = "";
}
addPlayer();
addPlayer();
</script>

</body>
</html>
